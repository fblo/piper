{{- if .Values.piper.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: piper-voices-pvc
  namespace: {{ .Values.namespace.name }}
spec:
  accessModes:
    - {{ .Values.piper.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.piper.persistence.size }}
  storageClassName: {{ .Values.piper.persistence.storageClass | quote }}
</write_to_file>