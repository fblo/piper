# Default values for piper
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# Global namespace configuration
namespace:
  name: piper
  create: true

# Piper application configuration
piper:
  replicaCount: 1

  image:
    repository: vs-inf-prd-for-fr-501.hostics.fr/connectics/fblo/piper
    tag: latest
    pullPolicy: IfNotPresent

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"

  service:
    type: ClusterIP
    port: 5051
    targetPort: 5051
    clusterIP: "10.199.10.19"

  persistence:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteOnce
    size: 5Gi
    mountPath: /opt/voices
</write_to_file>